include:
  - db/postgres.yaml
  - elk/elk.yaml
  - observability/observability.yaml
services:
  dependency-status-scanner:
    container_name: dependency-status-scanner
    image: mikbac/dependency-status-scanner:1.0
    profiles:
      - dss-app
    hostname: dependency-status-scanner
    ports:
      - '8080:8080'
    environment:
      - CONSOLE_LOG_LEVEL=INFO
      - SOCKET_LOG_LEVEL=INFO
      - PROJECTS_SCANNER_BATCH_SIZE=2
      - DATABASE_URL=jdbc:postgresql://postgres-db:5432/dependency_status_database
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres1
      - GITHUB_TOKEN=
      - SOCKER_LISTENER_HOST=filebeat
      - SOCKER_LISTENER_PORT=4560
      - ALLOY_METRICS_URL=http://alloy:4318/v1/metrics
      - ALLOY_TRACING_ENDPOINT=alloy:4317
    depends_on:
      - postgres-db
      - filebeat
      - elasticsearch
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - dss-network

networks:
  dss-network:
