services:
  alloy:
    image: grafana/alloy:v1.10.2
    profiles:
      - observability
    ports:
      - '4318:4318'
      - '4317:4317'
    volumes:
      - ./alloy-config/config.alloy:/etc/alloy/config.alloy
    command:
      - run
      - /etc/alloy/config.alloy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - dss-network
  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    profiles:
      - observability
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - dss-network
  tempo:
    image: grafana/tempo:2.8.2
    profiles:
      - observability
    command:
      - "--config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo-config/tempo.yaml:/etc/tempo.yaml
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - dss-network
  grafana:
    image: grafana/grafana:12.2
    profiles:
      - observability
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana-config/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-config/dashboards:/etc/grafana/dashboards:ro
    networks:
      - dss-network
