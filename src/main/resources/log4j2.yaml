Configuration:
  Properties:
    Property:
      - name: CONSOLE_LOG_LEVEL
        value: "OFF"
      - name: SOCKET_LOG_LEVEL
        value: "OFF"
      - name: SOCKER_LISTENER_HOST
        value: "localhost"
      - name: SOCKER_LISTENER_PORT
        value: "4560"
  Appenders:
    Console:
      name: Console_Appender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "[%-5level] [%X{correlationId}] [%X{traceId}] [%X{spanId}] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n"
    Socket:
      name: Socket_Appender
      host: ${env:SOCKER_LISTENER_HOST}
      port: ${env:SOCKER_LISTENER_PORT}
      JSONLayout:
        complete: false
        compact: true
        eventEol: true
        stacktraceAsString: true
        KeyValuePair:
          - key: appName
            value: Dependency-status-scanner
  Loggers:
    Logger:
      - name: org.zalando.logbook.Logbook
        level: "TRACE"
        additivity: false
        AppenderRef:
          - ref: Console_Appender
    Root:
      level: "INFO"
      AppenderRef:
        - ref: Console_Appender
          level: ${env:CONSOLE_LOG_LEVEL}
        - ref: Socket_Appender
          level: ${env:SOCKET_LOG_LEVEL}
